services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/code
    volumes:
      - ./backend/app:/code/app
      - ./backend/tests:/code/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
