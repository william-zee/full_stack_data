services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/code
    volumes:
      - ./backend/app:/code/app
      - ./backend/tests:/code/tests

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=http://backend:8000
      - PYTHONPATH=/code
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload