{# Extrait de app/templates/items/form.html #}
{% if erreur %}
  <p class="alerte alerte-erreur">{{ erreur }}</p>
{% endif %}

<form method="post" action="/items">
  
  <label for="titre">Titre</label>
  <input type="text" id="titre" name="titre" required minlength="3"
         value="{{ saisie.titre if saisie else '' }}">

  <label for="description">Description</label>
  <textarea id="description" name="description">{{ saisie.description if saisie else '' }}</textarea>

  <label for="tarif_jour">Tarif journalier (€)</label>
  <input type="number" id="tarif_jour" name="tarif_jour" required min="0.01" step="0.01"
         value="{{ saisie.tarif_jour if saisie else '' }}">

  <label for="disponible">
   
    <input type="checkbox" id="disponible" name="disponible"
           {% if saisie and saisie.disponible %}checked{% endif %}>
    Disponible
  </label>

  <button type="submit">Créer l'item</button>
</form>
